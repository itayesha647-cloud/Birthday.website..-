<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Special Message</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    font-family:Georgia,"Times New Roman",serif;
    text-align:center;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.7),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eee0ff,
            #d8b4fe,
            #c084fc,
            #a855f7,
            #8b5cf6
        );

    color:#3b0764;
}


/* TOP */

.title{
    padding-top:38px;

    font-size:21px;

    letter-spacing:4px;

    font-weight:bold;

    color:#4c1d95;

    text-shadow:
        0 0 8px white,
        0 0 18px #eadcff;
}


h1{
    margin:15px 10px 8px;

    font-size:43px;

    color:white;

    text-shadow:
        0 0 8px #6b21a8,
        0 0 20px #7e22ce,
        0 0 35px #c084fc;
}


.subtitle{
    font-size:19px;

    font-weight:bold;

    color:#4c1d95;

    text-shadow:0 0 8px white;
}


/* ENVELOPE AREA */

.envelopeArea{

    position:relative;

    width:340px;
    height:260px;

    margin:55px auto 0;
}


/* ENVELOPE */

.envelope{

    position:absolute;

    width:340px;
    height:215px;

    left:0;
    bottom:0;

    background:
        linear-gradient(
            135deg,
            #f3e8ff,
            #d8b4fe
        );

    border-radius:10px;

    cursor:pointer;

    box-shadow:
        0 15px 35px rgba(59,7,100,.28),
        0 0 25px rgba(255,255,255,.5);

    animation:floatEnvelope 3s ease-in-out infinite;

    transition:.3s;

}


/* ENVELOPE FRONT */

.envelope::before{

    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:0;

    border-left:170px solid transparent;
    border-right:170px solid transparent;
    border-bottom:130px solid #c084fc;

    z-index:3;

}


/* SIDE FOLD */

.envelope::after{

    content:"";

    position:absolute;

    left:0;
    bottom:0;

    width:0;
    height:0;

    border-top:108px solid transparent;
    border-bottom:108px solid transparent;
    border-left:170px solid #e9d5ff;

    z-index:2;

}


/* TOP FLAP */

.flap{

    position:absolute;

    top:0;
    left:0;

    width:0;
    height:0;

    border-left:170px solid transparent;
    border-right:170px solid transparent;
    border-top:120px solid #a855f7;

    z-index:5;
}


/* HEART SEAL */

.seal{

    position:absolute;

    left:50%;
    top:78px;

    transform:translateX(-50%);

    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;

    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            135deg,
            #7e22ce,
            #c026d3
        );

    color:white;

    font-size:25px;

    z-index:10;

    box-shadow:
        0 6px 18px rgba(59,7,100,.35);
}


/* FLOAT */

@keyframes floatEnvelope{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-10px) rotate(1deg);
    }

}


/* HOVER */

.envelope:hover{

    transform:
        scale(1.04);

    box-shadow:
        0 18px 40px rgba(59,7,100,.35),
        0 0 35px rgba(255,255,255,.7);
}


/* BUTTON */

.messageBtn{

    position:fixed;

    bottom:35px;

    left:50%;

    transform:translateX(-50%);

    padding:15px 40px;

    border:none;

    border-radius:35px;

    background:
        linear-gradient(
            135deg,
            #581c87,
            #7e22ce,
            #a855f7
        );

    color:white;

    font-size:18px;

    font-family:Georgia,"Times New Roman",serif;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 22px rgba(59,7,100,.35),
        0 0 18px rgba(255,255,255,.5);

    transition:.3s;
}


.messageBtn:hover{

    transform:
        translateX(-50%)
        translateY(-4px)
        scale(1.05);

    box-shadow:
        0 12px 30px rgba(59,7,100,.5),
        0 0 25px white;
}


/* SMALL HEARTS */

.heart{

    position:fixed;

    color:#f5d0fe;

    font-size:24px;

    opacity:.75;

    animation:heartFloat 4s ease-in-out infinite;
}


.heart1{
    left:10%;
    top:30%;
}

.heart2{
    right:12%;
    top:35%;
    animation-delay:1s;
}

.heart3{
    left:18%;
    bottom:25%;
    animation-delay:2s;
}

.heart4{
    right:18%;
    bottom:28%;
    animation-delay:.5s;
}


@keyframes heartFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-14px);
    }

}


/* MOBILE */

@media(max-width:500px){

    .title{
        padding-top:25px;
        font-size:16px;
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:17px;
    }

    .envelopeArea{
        width:280px;
        height:230px;
        margin-top:45px;
    }

    .envelope{
        width:280px;
        height:180px;
    }

    .envelope::before{
        border-left-width:140px;
        border-right-width:140px;
        border-bottom-width:110px;
    }

    .envelope::after{
        border-left-width:140px;
    }

    .flap{
        border-left-width:140px;
        border-right-width:140px;
        border-top-width:100px;
    }

    .messageBtn{
        bottom:25px;
    }

}

</style>
</head>


<body>


<div class="title">
    A Little Message
</div>


<h1>
    For You 💜
</h1>


<div class="subtitle">
    A special surprise is waiting ✨
</div>


<!-- FLOATING HEARTS -->

<div class="heart heart1">♡</div>
<div class="heart heart2">♡</div>
<div class="heart heart3">♡</div>
<div class="heart heart4">♡</div>


<!-- ENVELOPE -->

<div class="envelopeArea">

    <div
        class="envelope"
        onclick="openNextPage()"
    >

        <div class="flap"></div>

        <div class="seal">
            ♥
        </div>

    </div>

</div>


<!-- BUTTON -->

<button
    class="messageBtn"
    onclick="openNextPage()"
>
    Open Message 💌
</button>


<script>

function openNextPage(){

    window.location.href = "six.html";

}

</script>


</body>
</html>
