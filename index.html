<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            background:
                radial-gradient(circle at top, #c084fc 0%, #8b5cf6 35%, #4c1d95 70%, #1e1038 100%);
            color: white;
            overflow: hidden;
        }

        /* ---------- MAIN CONTENT ---------- */

        .main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
            position: relative;
        }

        .title {
            position: absolute;
            top: 30px;
            width: 100%;
            font-size: 32px;
            letter-spacing: 3px;
            font-weight: bold;

            background: linear-gradient(
                90deg,
                #ffffff,
                #e9d5ff,
                #ffffff,
                #c084fc,
                #ffffff
            );

            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shimmer 3s linear infinite;

            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        @keyframes shimmer {
            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 300% center;
            }
        }

        /* ---------- DP ---------- */

        .dp {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;

            border: 5px solid rgba(255,255,255,0.9);

            box-shadow:
                0 0 15px #fff,
                0 0 35px #c084fc,
                0 0 70px #a855f7;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .message {
            margin-top: 25px;
            font-size: 25px;
            max-width: 600px;

            text-shadow:
                0 0 10px #fff,
                0 0 25px #c084fc;

            animation: fadeIn 2s ease;
        }

        .sub {
            margin-top: 10px;
            font-size: 16px;
            opacity: 0.85;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- PIN SCREEN ---------- */

        #pinScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            background:
                radial-gradient(circle at center, #6d28d9, #2e1065 60%, #12051f);

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            transition: opacity 1s ease;
        }

        .pinBox {
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;

            border-radius: 25px;

            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.25);

            box-shadow:
                0 0 30px rgba(192,132,252,0.4),
                inset 0 0 20px rgba(255,255,255,0.05);
        }

        .pinTitle {
            font-size: 30px;
            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                #fff,
                #e9d5ff,
                #fff
            );

            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shimmer 2.5s linear infinite;
        }

        .pinText {
            font-size: 15px;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        .pinInput {
            width: 100%;
            padding: 15px;

            border: none;
            outline: none;

            border-radius: 12px;

            background: rgba(255,255,255,0.15);
            color: white;

            text-align: center;
            font-size: 22px;
            letter-spacing: 8px;

            border: 1px solid rgba(255,255,255,0.3);
        }

        .pinInput::placeholder {
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }

        .unlockBtn {
            margin-top: 18px;
            padding: 13px 35px;

            border: none;
            border-radius: 30px;

            background: linear-gradient(
                135deg,
                #c084fc,
                #7c3aed
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 15px #c084fc,
                0 0 30px rgba(192,132,252,0.4);

            transition: 0.3s;
        }

        .unlockBtn:hover {
            transform: scale(1.05);
            box-shadow:
                0 0 25px #fff,
                0 0 45px #c084fc;
        }

        .error {
            margin-top: 15px;
            color: #f3d5ff;
            font-size: 14px;
            display: none;
        }

        /* ---------- CINEMATIC CURTAINS ---------- */

        .curtain {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 90;

            background:
                repeating-linear-gradient(
                    90deg,
                    #4c1d95 0px,
                    #6d28d9 20px,
                    #3b0764 40px,
                    #7e22ce 60px
                );

            box-shadow:
                inset 0 0 60px rgba(0,0,0,0.5),
                0 0 30px rgba(0,0,0,0.5);

            transition: transform 2.2s cubic-bezier(.77,0,.18,1);
        }

        .curtain.left {
            left: 0;
        }

        .curtain.right {
            right: 0;
        }

        .open .curtain.left {
            transform: translateX(-100%);
        }

        .open .curtain.right {
            transform: translateX(100%);
        }

        /* ---------- SPARKLES ---------- */

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;

            background: white;
            border-radius: 50%;

            box-shadow:
                0 0 8px white,
                0 0 15px #c084fc;

            animation: sparkle 2s infinite ease-in-out;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        @media (max-width: 600px) {

            .title {
                font-size: 25px;
                top: 25px;
            }

            .dp {
                width: 125px;
                height: 125px;
            }

            .message {
                font-size: 21px;
            }
        }
        .nextBtn {
    margin-top: 25px;
    padding: 13px 35px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 30px;

    background: rgba(255,255,255,0.12);
    color: white;

    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 0 12px #c084fc,
        0 0 25px rgba(192,132,252,0.35);

    backdrop-filter: blur(8px);

    transition: all 0.3s ease;
}

.nextBtn:hover {
    transform: scale(1.08);
    background: rgba(192,132,252,0.35);

    box-shadow:
        0 0 20px #ffffff,
        0 0 40px #c084fc;
        .nextBtn {
    margin-top: 25px;
    padding: 13px 35px;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 30px;

    background: rgba(255,255,255,0.12);
    color: white;

    font-size: 17px;
    font-weight: bold;
    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 0 12px #c084fc,
        0 0 25px rgba(192,132,252,0.35);

    backdrop-filter: blur(8px);

    transition: all 0.3s ease;
}

.nextBtn:hover {
    transform: scale(1.08);
    background: rgba(192,132,252,0.35);

    box-shadow:
        0 0 20px #ffffff,
        0 0 40px #c084fc;
}
}
    </style>
</head>

<body>

    <!-- PIN SCREEN -->

    <div id="pinScreen">

        <div class="pinBox">

            <div class="pinTitle">
                A Little Surprise
            </div>

            <div class="pinText">
                Enter the secret PIN to open your surprise ✨
            </div>

            <input
                type="password"
                id="pinInput"
                class="pinInput"
                maxlength="5"
                placeholder="••••"
            >

            <br>

            <button class="unlockBtn" onclick="unlock()">
                Unlock ✨
            </button>

            <div id="error" class="error">
                Hmm... that's not the right PIN 💜
            </div>

        </div>

    </div>


    <!-- CINEMATIC CURTAINS -->

    <div class="curtain left"></div>
    <div class="curtain right"></div>


    <!-- MAIN WEBSITE -->

    <div class="main">

        <div class="title">
            A Little Surprise
        </div>


        <!-- CHANGE dp.jpg TO YOUR PHOTO NAME -->

        <img
            src="dp.jpg"
            alt="DP"
            class="dp"
        >


        <div class="message">
            ✨ Something special is waiting for you ✨
        </div>

        <div class="sub">
            A little surprise, made with lots of love 💜
        </div>
<button class="nextBtn" onclick="goNext()">
    Next ✨
</button>
    </div>


    <!-- SPARKLES -->

    <span class="sparkle" style="top:15%; left:20%; animation-delay:0s;"></span>
    <span class="sparkle" style="top:25%; left:80%; animation-delay:0.5s;"></span>
    <span class="sparkle" style="top:70%; left:15%; animation-delay:1s;"></span>
    <span class="sparkle" style="top:80%; left:85%; animation-delay:1.5s;"></span>
    <span class="sparkle" style="top:45%; left:90%; animation-delay:0.7s;"></span>
    <span class="sparkle" style="top:55%; left:10%; animation-delay:1.2s;"></span>


    <script>

        /* CHANGE YOUR PIN HERE */

        const correctPIN = "10OCT";


        function unlock() {

            const enteredPIN =
                document.getElementById("pinInput").value;

            const pinScreen =
                document.getElementById("pinScreen");

            const error =
                document.getElementById("error");


            if (enteredPIN === correctPIN) {

                /* Hide PIN screen */

                pinScreen.style.opacity = "0";

                setTimeout(() => {
                    pinScreen.style.display = "none";
                }, 1000);


                /* Open cinematic curtains */

                setTimeout(() => {

                    document.body.classList.add("open");

                }, 700);

            }

            else {

                error.style.display = "block";

                document.getElementById("pinInput").value = "";

            }

        }


        /* Press Enter to unlock */

        document.getElementById("pinInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    unlock();
                }

            });
function goNext() {
    window.location.href = "two.html";
}
    </script>

</body>
</html>
