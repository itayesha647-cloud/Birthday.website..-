<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Celebration</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow-x:hidden;

    font-family:Georgia,"Times New Roman",serif;
    text-align:center;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.65),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eee0ff,
            #d8b4fe,
            #c084fc,
            #a855f7,
            #8b5cf6
        );

    color:#3b0764;
}


/* TOP TEXT */

.topText{
    padding-top:30px;

    font-size:20px;
    letter-spacing:4px;
    font-weight:bold;

    color:#4c1d95;

    text-shadow:
        0 0 8px white,
        0 0 18px #eadcff;

    animation:softGlow 2s infinite alternate;
}

@keyframes softGlow{

    from{
        opacity:.75;
    }

    to{
        opacity:1;
    }
}


/* HEADING */

h1{
    margin:16px 10px 5px;

    font-size:42px;

    color:white;

    text-shadow:
        0 0 8px #6b21a8,
        0 0 18px #7e22ce,
        0 0 35px #c084fc;
}


/* HEART */

.heart{
    margin-top:3px;

    font-size:38px;

    color:#7e22ce;

    animation:heartBeat 1.2s infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.18);
    }
}


/* LINE */

.line{
    width:190px;
    height:2px;

    margin:9px auto 5px;

    background:
        linear-gradient(
            to right,
            transparent,
            #7e22ce,
            transparent
        );

    box-shadow:0 0 10px #d8b4fe;
}


/* CAKE AREA */

.cakeArea{
    position:relative;

    width:440px;
    height:360px;

    margin:0 auto;
}


/* WHOLE CAKE */

.cake{
    position:absolute;

    width:350px;
    height:270px;

    left:50%;
    top:70px;

    transform:translateX(-50%);

    animation:
        cakeFloat 3.5s ease-in-out infinite,
        cakeGlow 2.5s ease-in-out infinite alternate;
}


/* CAKE FLOAT ANIMATION */

@keyframes cakeFloat{

    0%,100%{
        transform:
            translateX(-50%)
            translateY(0);
    }

    50%{
        transform:
            translateX(-50%)
            translateY(-9px);
    }
}


/* CAKE GLOW */

@keyframes cakeGlow{

    from{
        filter:
            drop-shadow(0 10px 15px rgba(59,7,100,.20));
    }

    to{
        filter:
            drop-shadow(0 14px 28px rgba(126,34,206,.38));
    }
}


/* CAKE BODY */

.cakeBody{
    position:absolute;

    left:0;
    bottom:5px;

    width:350px;
    height:135px;

    border-radius:20px 20px 28px 28px;

    background:
        linear-gradient(
            to bottom,
            #c084fc,
            #a855f7 50%,
            #7e22ce
        );

    border:3px solid #6b21a8;

    box-shadow:
        inset 0 8px 10px rgba(255,255,255,.22),
        inset 0 -12px 15px rgba(59,7,100,.12);
}


/* CAKE TOP */

.cakeTop{
    position:absolute;

    left:0;
    top:72px;

    width:350px;
    height:78px;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #f8edff
        );

    border:3px solid #6b21a8;

    box-shadow:
        0 5px 14px rgba(59,7,100,.18),
        inset 0 -9px 0 #e9d5ff;

    z-index:5;
}


/* FROSTING DRIPS */

.drip{
    position:absolute;

    bottom:-22px;

    width:27px;
    height:30px;

    background:#f8edff;

    border-radius:
        0 0 15px 15px;

    border-left:3px solid #6b21a8;
    border-right:3px solid #6b21a8;
    border-bottom:3px solid #6b21a8;
}


/* DRIPS */

.drip1{
    left:38px;
}

.drip2{
    left:92px;
    height:24px;
}

.drip3{
    left:147px;
    height:35px;
}

.drip4{
    left:205px;
    height:25px;
}

.drip5{
    left:260px;
    height:31px;
}


/* CAKE DECORATIONS */

.berry{
    position:absolute;

    width:14px;
    height:14px;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ffffff,
            #f0abfc 35%,
            #c026d3 100%
        );

    border:2px solid #7e22ce;

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    z-index:12;

    animation:berryGlow 2s ease-in-out infinite alternate;
}

@keyframes berryGlow{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.1);
    }
}


.berry1{
    left:42px;
    bottom:55px;
}

.berry2{
    left:92px;
    bottom:80px;
}

.berry3{
    left:140px;
    bottom:48px;
}

.berry4{
    right:42px;
    bottom:55px;
}

.berry5{
    right:92px;
    bottom:80px;
}

.berry6{
    right:140px;
    bottom:48px;
}


/* LITTLE HEART DECORATION */

.cakeHearts{
    position:absolute;

    left:0;
    bottom:28px;

    width:100%;

    color:#f3e8ff;

    font-size:17px;
    letter-spacing:24px;

    z-index:15;

    text-shadow:
        0 0 8px rgba(255,255,255,.8);
}


/* CANDLE */

.candle{
    position:absolute;

    left:50%;
    top:-18px;

    width:30px;
    height:88px;

    transform:translateX(-50%);

    background:
        repeating-linear-gradient(
            135deg,
            #ffffff 0px,
            #ffffff 10px,
            #c084fc 10px,
            #c084fc 20px
        );

    border:3px solid #6b21a8;

    border-radius:8px;

    box-shadow:
        0 5px 14px rgba(59,7,100,.25);

    cursor:pointer;

    z-index:30;

    transition:.3s;
}


/* CANDLE HOVER */

.candle:hover{
    transform:
        translateX(-50%)
        scale(1.05);

    box-shadow:
        0 7px 20px rgba(126,34,206,.4);
}


/* WICK */

.wick{
    position:absolute;

    width:4px;
    height:12px;

    left:50%;
    top:-11px;

    transform:translateX(-50%);

    background:#3b0764;

    border-radius:5px;
}


/* FLAME */

.flame{
    position:absolute;

    width:35px;
    height:48px;

    left:50%;
    top:-58px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse at center,
            #fffde7 0%,
            #fde047 35%,
            #f97316 70%,
            transparent 73%
        );

    border-radius:50%;

    filter:
        drop-shadow(0 0 8px #facc15)
        drop-shadow(0 0 18px #fb923c);

    animation:flameMove .6s infinite alternate;

    z-index:35;
}


/* FLAME ANIMATION */

@keyframes flameMove{

    from{
        transform:
            translateX(-50%)
            scale(1)
            rotate(-3deg);
    }

    to{
        transform:
            translateX(-50%)
            scale(1.12)
            rotate(3deg);
    }
}


/* BLOWN FLAME */

.candle.blown .flame{

    animation:blowOut .8s forwards;
}


@keyframes blowOut{

    0%{
        opacity:1;

        transform:
            translateX(-50%)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translateX(-60px)
            scale(.15);
    }
}


/* SMOKE */

.smoke{
    position:absolute;

    width:14px;
    height:30px;

    left:50%;
    top:-68px;

    transform:translateX(-50%);

    background:rgba(255,255,255,.7);

    border-radius:50%;

    opacity:0;
}


.candle.blown .smoke{

    animation:smokeMove 2s forwards;
}


@keyframes smokeMove{

    0%{
        opacity:0;

        transform:
            translateX(-50%)
            translateY(10px)
            scale(.5);
    }

    30%{
        opacity:.8;
    }

    100%{
        opacity:0;

        transform:
            translateX(-10px)
            translateY(-50px)
            scale(1.7);
    }
}


/* TEXT */

.candleText{

    margin-top:-15px;

    min-height:30px;

    font-size:20px;
    font-weight:bold;

    color:#4c1d95;

    text-shadow:
        0 0 8px white,
        0 0 15px #e9d5ff;
}


.instruction{

    margin-top:7px;

    min-height:30px;

    font-size:18px;
    font-weight:bold;

    color:#4c1d95;
}


/* BUTTON */

.clickBtn{

    margin-top:17px;

    padding:15px 38px;

    border:none;
    border-radius:35px;

    background:
        linear-gradient(
            135deg,
            #581c87,
            #7e22ce,
            #a855f7
        );

    color:white;

    font-size:18px;

    font-family:Georgia,"Times New Roman",serif;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 22px rgba(59,7,100,.35),
        0 0 15px rgba(255,255,255,.4);

    transition:.3s;
}


.clickBtn:hover{

    transform:
        translateY(-4px)
        scale(1.05);

    box-shadow:
        0 12px 30px rgba(59,7,100,.5),
        0 0 25px white;
}


/* SPARKLES */

.sparkle{
    position:fixed;

    color:white;

    font-size:20px;

    pointer-events:none;

    animation:sparkle 3s linear infinite;

    opacity:.8;
}


.s1{
    top:20%;
    left:10%;
}

.s2{
    top:35%;
    right:10%;
    animation-delay:1s;
}

.s3{
    top:70%;
    left:15%;
    animation-delay:1.5s;
}

.s4{
    top:65%;
    right:12%;
    animation-delay:2s;
}


@keyframes sparkle{

    0%{
        transform:
            scale(.5)
            rotate(0deg);

        opacity:0;
    }

    50%{
        transform:
            scale(1.3)
            rotate(180deg);

        opacity:1;
    }

    100%{
        transform:
            scale(.5)
            rotate(360deg);

        opacity:0;
    }
}


/* MOBILE */

@media(max-width:500px){

    h1{
        font-size:32px;
    }

    .topText{
        font-size:16px;
    }

    .cakeArea{
        transform:scale(.78);
        transform-origin:top center;
        margin-bottom:-65px;
    }

}

</style>
</head>


<body>


<!-- SPARKLES -->

<div class="sparkle s1">✦</div>
<div class="sparkle s2">✧</div>
<div class="sparkle s3">✦</div>
<div class="sparkle s4">✧</div>


<!-- TOP -->

<div class="topText">
    A Little Celebration
</div>


<h1>
    Happy Birthday Api Sadia
</h1>


<div class="heart">
    ♥
</div>


<div class="line"></div>


<!-- CAKE -->

<div class="cakeArea">

    <div class="cake" id="cake">


        <!-- CANDLE -->

        <div
            class="candle"
            id="candle"
            onclick="blowCandle()"
            title="Click the candle"
        >

            <div class="wick"></div>

            <div class="flame"></div>

            <div class="smoke"></div>

        </div>


        <!-- CAKE TOP -->

        <div class="cakeTop">

            <div class="drip drip1"></div>
            <div class="drip drip2"></div>
            <div class="drip drip3"></div>
            <div class="drip drip4"></div>
            <div class="drip drip5"></div>

        </div>


        <!-- CAKE BODY -->

        <div class="cakeBody"></div>


        <!-- DECORATION -->

        <div class="cakeHearts">
            ♥ ✦ ♥ ✦ ♥
        </div>


        <!-- BERRIES -->

        <div class="berry berry1"></div>
        <div class="berry berry2"></div>
        <div class="berry berry3"></div>
        <div class="berry berry4"></div>
        <div class="berry berry5"></div>
        <div class="berry berry6"></div>

    </div>

</div>


<!-- CANDLE TEXT -->

<div
    class="candleText"
    id="candleText"
>
    Blow the Candle 🕯️
</div>


<!-- INSTRUCTION -->

<div
    class="instruction"
    id="instruction"
>
    Click the candle to blow it ✨
</div>


<!-- NEXT BUTTON -->

<button
    class="clickBtn"
    onclick="goNext()"
>
    Click Here ✨
</button>


<script>

let candleBlown = false;


function blowCandle(){

    if(candleBlown){
        return;
    }

    candleBlown = true;


    const candle =
        document.getElementById("candle");

    const candleText =
        document.getElementById("candleText");

    const instruction =
        document.getElementById("instruction");


    /* ONLY CANDLE BLOWS */

    candle.classList.add("blown");


    candleText.innerHTML =
        "Wish Made! ✨💜";


    instruction.innerHTML =
        "Your wish is on its way! 💜✨";

}


function goNext(){

    window.location.href =
        "three.html";

}

</script>


</body>
</html>
