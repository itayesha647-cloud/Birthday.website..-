<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    font-family:Georgia,"Times New Roman",serif;
    text-align:center;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(255,255,255,.7),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eee0ff,
            #d8b4fe,
            #c084fc,
            #a855f7,
            #8b5cf6
        );

    color:#3b0764;
}


/* TOP TEXT */

.title{
    position:relative;
    z-index:100;

    padding-top:32px;

    font-size:21px;

    letter-spacing:4px;

    font-weight:bold;

    color:#4c1d95;

    text-shadow:
        0 0 8px white,
        0 0 18px #eadcff;

    animation:softGlow 2s infinite alternate;
}


@keyframes softGlow{

    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}


/* HEADING */

h1{
    position:relative;
    z-index:100;

    margin:15px 10px 5px;

    font-size:43px;

    color:white;

    text-shadow:
        0 0 8px #6b21a8,
        0 0 20px #7e22ce,
        0 0 38px #c084fc;

    animation:titleAppear 1.3s ease;
}


@keyframes titleAppear{

    from{
        opacity:0;
        transform:translateY(-20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* MESSAGE */

.message{
    position:relative;
    z-index:100;

    font-size:20px;

    font-weight:bold;

    color:#4c1d95;

    text-shadow:0 0 8px white;
}


/* BALLOON AREA */

.balloonArea{
    position:fixed;

    left:0;
    right:0;

    top:145px;
    bottom:95px;

    overflow:hidden;

    pointer-events:none;
}


/* BALLOON */

.balloon{

    position:absolute;

    width:72px;
    height:90px;

    border-radius:
        50%
        50%
        45%
        45%;

    cursor:pointer;

    pointer-events:auto;

    box-shadow:
        inset -10px -12px 18px rgba(59,7,100,.15),
        inset 10px 8px 15px rgba(255,255,255,.35),
        0 8px 18px rgba(59,7,100,.18);

    animation:
        balloonFloat 3s ease-in-out infinite;

    transition:
        transform .2s,
        opacity .2s;
}


/* BALLOON SHINE */

.balloon::before{

    content:"";

    position:absolute;

    width:18px;
    height:30px;

    left:14px;
    top:13px;

    border-radius:50%;

    background:rgba(255,255,255,.55);

    transform:rotate(25deg);
}


/* BALLOON KNOT */

.balloon::after{

    content:"";

    position:absolute;

    left:50%;

    bottom:-8px;

    transform:translateX(-50%);

    width:0;
    height:0;

    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-top:10px solid currentColor;
}


/* STRING */

.string{

    position:absolute;

    width:1px;
    height:75px;

    background:rgba(59,7,100,.45);

    left:50%;

    top:100%;

    transform-origin:top;

}


/* BALLOON COLORS */

.purple{

    background:
        linear-gradient(
            135deg,
            #d8b4fe,
            #9333ea
        );

    color:#7e22ce;
}

.lilac{

    background:
        linear-gradient(
            135deg,
            #f3e8ff,
            #c084fc
        );

    color:#a855f7;
}

.violet{

    background:
        linear-gradient(
            135deg,
            #c084fc,
            #7e22ce
        );

    color:#6b21a8;
}

.pink{

    background:
        linear-gradient(
            135deg,
            #f5d0fe,
            #d946ef
        );

    color:#c026d3;
}


/* BALLOON POSITIONS */

.b1{
    left:6%;
    top:15%;

    animation-delay:0s;
}

.b2{
    left:20%;
    top:48%;

    animation-delay:.7s;
}

.b3{
    left:35%;
    top:8%;

    animation-delay:1.2s;
}

.b4{
    left:51%;
    top:45%;

    animation-delay:.4s;
}

.b5{
    left:67%;
    top:12%;

    animation-delay:1.6s;
}

.b6{
    left:82%;
    top:48%;

    animation-delay:1s;
}

.b7{
    left:42%;
    top:72%;

    animation-delay:2s;
}

.b8{
    left:10%;
    top:75%;

    animation-delay:2.5s;
}


/* GENTLE BALLOON MOVEMENT */

@keyframes balloonFloat{

    0%,100%{

        transform:
            translate(0,0)
            rotate(-3deg);
    }

    25%{

        transform:
            translate(8px,-7px)
            rotate(3deg);
    }

    50%{

        transform:
            translate(0,-12px)
            rotate(-2deg);
    }

    75%{

        transform:
            translate(-8px,-5px)
            rotate(3deg);
    }
}


/* HOVER */

.balloon:hover{

    transform:
        scale(1.08);

}


/* POP */

.balloon.pop{

    animation:balloonPop .45s forwards !important;

    pointer-events:none;
}


@keyframes balloonPop{

    0%{
        opacity:1;

        transform:scale(1);
    }

    45%{
        opacity:1;

        transform:scale(1.3);
    }

    100%{
        opacity:0;

        transform:scale(0);
    }
}


/* CONFETTI */

.confetti{

    position:fixed;

    width:8px;
    height:12px;

    pointer-events:none;

    z-index:200;

    animation:confettiFall 1.2s ease-out forwards;
}


@keyframes confettiFall{

    0%{

        opacity:1;

        transform:
            translate(0,0)
            rotate(0deg)
            scale(1);
    }

    100%{

        opacity:0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(500deg)
            scale(.5);
    }
}


/* POP MESSAGE */

.popMessage{

    position:fixed;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    z-index:300;

    opacity:0;

    font-size:28px;

    font-weight:bold;

    color:white;

    text-shadow:
        0 0 10px #6b21a8,
        0 0 25px #7e22ce;

    pointer-events:none;
}


.popMessage.show{

    animation:
        showPopMessage 2s ease forwards;
}


@keyframes showPopMessage{

    0%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.7);
    }

    25%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    70%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    100%{
        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(1.1);
    }
}


/* NEXT BUTTON */

.clickBtn{

    position:fixed;

    z-index:250;

    bottom:25px;

    left:50%;

    transform:translateX(-50%);

    padding:14px 38px;

    border:none;

    border-radius:35px;

    background:
        linear-gradient(
            135deg,
            #581c87,
            #7e22ce,
            #a855f7
        );

    color:white;

    font-size:18px;

    font-family:Georgia,"Times New Roman",serif;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 22px rgba(59,7,100,.35),
        0 0 15px rgba(255,255,255,.4);

    transition:.3s;
}


.clickBtn:hover{

    transform:
        translateX(-50%)
        translateY(-4px)
        scale(1.05);

    box-shadow:
        0 12px 30px rgba(59,7,100,.5),
        0 0 25px white;
}


/* MOBILE */

@media(max-width:500px){

    .title{
        font-size:16px;
        padding-top:25px;
    }

    h1{
        font-size:34px;
    }

    .message{
        font-size:18px;
    }

    .balloon{
        width:60px;
        height:77px;
    }

    .clickBtn{
        bottom:18px;
        padding:13px 34px;
    }

}

</style>
</head>


<body>


<!-- TOP -->

<div class="title">
    A Little Surprise
</div>


<h1>
    Let's Celebrate! 🎈
</h1>


<div class="message">
    Pop the balloons and make a wish ✨
</div>


<!-- BALLOONS -->

<div class="balloonArea">


    <div class="balloon purple b1">
        <div class="string"></div>
    </div>


    <div class="balloon lilac b2">
        <div class="string"></div>
    </div>


    <div class="balloon violet b3">
        <div class="string"></div>
    </div>


    <div class="balloon pink b4">
        <div class="string"></div>
    </div>


    <div class="balloon purple b5">
        <div class="string"></div>
    </div>


    <div class="balloon lilac b6">
        <div class="string"></div>
    </div>


    <div class="balloon violet b7">
        <div class="string"></div>
    </div>


    <div class="balloon pink b8">
        <div class="string"></div>
    </div>


</div>


<!-- POP MESSAGE -->

<div
    class="popMessage"
    id="popMessage"
>
    Yay! 🎉💜
</div>


<!-- NEXT BUTTON -->

<button
    class="clickBtn"
    onclick="goNext()"
>
    Click Here ✨
</button>


<script>


const balloons =
    document.querySelectorAll(".balloon");


balloons.forEach(function(balloon){

    balloon.addEventListener(
        "click",
        function(){

            if(
                balloon.classList.contains("pop")
            ){
                return;
            }

            popBalloon(balloon);

        }
    );

});


function popBalloon(balloon){

    const rect =
        balloon.getBoundingClientRect();

    const x =
        rect.left + rect.width / 2;

    const y =
        rect.top + rect.height / 2;


    balloon.classList.add("pop");


    createConfetti(x,y);


    const message =
        document.getElementById("popMessage");


    message.classList.remove("show");

    void message.offsetWidth;

    message.classList.add("show");

}


function createConfetti(x,y){

    const pieces = 18;


    for(
        let i = 0;
        i < pieces;
        i++
    ){

        const piece =
            document.createElement("div");


        piece.className =
            "confetti";


        piece.style.left =
            x + "px";


        piece.style.top =
            y + "px";


        piece.style.setProperty(
            "--x",
            (Math.random()*180-90) + "px"
        );


        piece.style.setProperty(
            "--y",
            (Math.random()*180-90) + "px"
        );


        const colors = [

            "#ffffff",
            "#e9d5ff",
            "#c084fc",
            "#a855f7",
            "#f5d0fe"

        ];


        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];


        document.body.appendChild(piece);


        setTimeout(
            function(){

                piece.remove();

            },
            1300
        );

    }

}


function goNext(){

    window.location.href =
        "five.html";

}

</script>


</body>
</html>
